[project]
name = "errand-line-agent"
version = "0.1.0"
description = "Self-hosted Errand Line voice agent"
requires-python = ">=3.11"
dependencies = ["cartesia-line==0.2.19", "anthropic>=2.3,<3", "httpx>=0.28,<1", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../harness"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["claude", "context", "convex_api", "main"]
